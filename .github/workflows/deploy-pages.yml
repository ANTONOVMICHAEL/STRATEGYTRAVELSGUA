name: Import verified GPU release and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-verified public release
        env:
          RELEASE_DOWNLOAD_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-07b4-8243-a654-663696e7ad1a/raw?se=2026-11-06T09%3A08%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=01a1affd-3d06-776b-a5b5-8feb3be053bf&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T02%3A17%3A38Z&ske=2026-11-07T02%3A17%3A38Z&sks=b&skv=2026-02-06&sig=pPPjMxwYqsviUwY0nNzMhkVwMNwknWWDQZkdcQpjZnw%3D"
        run: curl --fail --location --retry 2 "$RELEASE_DOWNLOAD_URL" -o /tmp/sgua-pages.zip
      - name: Validate and retain public assets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,tarfile,hashlib,json,shutil
          archive=pathlib.Path('/tmp/sgua-pages.zip')
          digest='492dac18d10df48a49310c8b2281e33322ef55d56f7e2ac45303edf739b9c199'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(archive) as z:
            assert z.namelist()==['artifact.tar']
            z.extract('artifact.tar','/tmp/sgua-release')
          stage=pathlib.Path('.pages-site');stage.mkdir()
          names=['.nojekyll','assets','data','plans','index.html','favicon.svg','sgua-95.svg']
          with tarfile.open('/tmp/sgua-release/artifact.tar') as t:
            for item in t:
              path=pathlib.PurePosixPath(item.name)
              assert not path.is_absolute() and '..' not in path.parts
              assert item.isfile() or item.isdir()
              assert not path.parts or path.parts[0] in names,item.name
            t.extractall(stage,filter='data')
          assert set(p.name for p in stage.iterdir())==set(names)
          forbidden={'.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.zip','.tar','.pem','.key'}
          for file in stage.rglob('*'):
            if not file.is_file():continue
            assert file.suffix.lower() not in forbidden and not file.name.startswith('.env'),file
            if file.suffix=='.json':json.loads(file.read_text())
            if file.suffix in {'.js','.css','.html'}:assert b'/SGUA_OFFICE/' not in file.read_bytes(),file
          assert '/STRATEGYTRAVELSGUA/assets/' in (stage/'index.html').read_text()
          studio=stage/'assets/academy/studio'
          manifest=json.loads((studio/'manifest.json').read_text())
          assert manifest['roomUid']=='K01-F02-T029' and len(manifest['entities'])==138
          runtime=json.loads((studio/'runtime-manifest.json').read_text())
          assert runtime['revision']=='room202-gpu-20261106' and len(runtime['textures'])==26
          assert hashlib.sha256((studio/'room-202-studio.glb').read_bytes()).hexdigest()==runtime['sourceGlbSha256']
          for texture in runtime['textures']:
            assert hashlib.sha256((studio/texture['file']).read_bytes()).hexdigest()==texture['sha256']
          assert any(b'room202-gpu-20261106' in file.read_bytes() for file in (stage/'assets').glob('*.js'))
          release=dict(sourceCommit='f43544ba475b3dfeb0bb100d2906aeb5ae3786af',runtimeRevision='room202-gpu-20261106',resourceRevision=manifest['qualityRevision'],publicBase='/STRATEGYTRAVELSGUA/',publishedAt='2026-11-06',facilityStorage='browser-local',sourceArtifactSha256=digest,texturePayloadBc7Bytes=runtime['totals']['bc7MipBytes'])
          (stage/'release.json').write_text(json.dumps(release,indent=2)+'\n')
          names.append('release.json')
          for name in names:
            old=pathlib.Path(name)
            if old.is_dir():shutil.rmtree(old)
            elif old.exists():old.unlink()
            if (stage/name).is_dir():shutil.copytree(stage/name,old)
            else:shutil.copy2(stage/name,old)
          print('Verified and retained Room 202 GPU release, 26 compressed maps, 138 objects')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .nojekyll assets data plans index.html favicon.svg sgua-95.svg release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Room 202 GPU rendering repair'
            git push origin HEAD:main
          fi
      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
