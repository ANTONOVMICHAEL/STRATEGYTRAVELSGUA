name: Publish SGUA digital twin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the retained public release
        uses: actions/checkout@v4
      - name: Verify and stage the complete digital twin
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,shutil,json,hashlib
          stage=pathlib.Path('.pages-site');stage.mkdir()
          names=['.nojekyll','assets','data','plans','index.html','favicon.svg','sgua-95.svg','release.json']
          release=json.loads(pathlib.Path('release.json').read_text())
          assert release['publicBase']=='/STRATEGYTRAVELSGUA/'
          assert '/STRATEGYTRAVELSGUA/assets/' in pathlib.Path('index.html').read_text()
          forbidden={'.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.zip','.tar','.pem','.key'}
          for name in names:
            source=pathlib.Path(name)
            assert source.exists(),name
            if source.is_dir():shutil.copytree(source,stage/name)
            else:shutil.copy2(source,stage/name)
          for file in stage.rglob('*'):
            if not file.is_file():continue
            assert file.suffix.lower() not in forbidden and not file.name.startswith('.env'),file
            if file.suffix=='.json':json.loads(file.read_text())
            if file.suffix in {'.js','.html','.css'}:assert b'/SGUA_OFFICE/' not in file.read_bytes(),file
          manifest=json.loads((stage/'assets/academy/studio/manifest.json').read_text())
          assert manifest['roomUid']=='K01-F02-T029' and len(manifest['entities'])==138
          studio=stage/'assets/academy/studio'
          runtime=json.loads((studio/'runtime-manifest.json').read_text())
          assert runtime['revision']==release['runtimeRevision'] and len(runtime['textures'])==26
          assert hashlib.sha256((studio/'room-202-studio.glb').read_bytes()).hexdigest()==runtime['sourceGlbSha256']
          for texture in runtime['textures']:
            assert hashlib.sha256((studio/texture['file']).read_bytes()).hexdigest()==texture['sha256']
          print('Verified current public digital twin from',release['sourceCommit'])
          PY
      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
