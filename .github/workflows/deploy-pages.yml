name: Publish current SGUA digital twin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out existing public publication
        uses: actions/checkout@v4
      - name: Import verified public release
        env:
          RELEASE_ARCHIVE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-1650-820a-809a-c1b162e6a4e9/raw?se=2026-11-06T07%3A43%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=01a1afc5-54b0-7a24-a1f1-92229ba768a6&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T05%3A22%3A06Z&ske=2026-11-07T05%3A22%3A06Z&sks=b&skv=2026-02-06&sig=t478y20O0GH6P6gKRgJgvnVwdt%2BYJGxd2IY/Qe6ygwU%3D"
          RELEASE_ARCHIVE_SHA256: f92f419d3c1adbe3c0d43b79f48a6400be5ac80518870eef43a7a1c92b2b6c61
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 "$RELEASE_ARCHIVE_URL" --output /tmp/sgua-pages.zip
          echo "$RELEASE_ARCHIVE_SHA256  /tmp/sgua-pages.zip" | sha256sum --check
          python3 - <<'PY'
          import pathlib, zipfile, tarfile, shutil, json, hashlib
          stage=pathlib.Path('.pages-site');stage.mkdir()
          with zipfile.ZipFile('/tmp/sgua-pages.zip') as archive:
            members=archive.namelist()
            assert members==['artifact.tar'], members
            with archive.open('artifact.tar') as source,open('/tmp/sgua-pages.tar','wb') as dest:shutil.copyfileobj(source,dest)
          with tarfile.open('/tmp/sgua-pages.tar') as archive:
            for member in archive.getmembers():
              p=pathlib.PurePosixPath(member.name)
              assert not p.is_absolute() and '..' not in p.parts and not member.issym() and not member.islnk(), member.name
            archive.extractall(stage,filter='data')
          allowed={'.nojekyll','assets','data','plans','index.html','favicon.svg','sgua-95.svg'}
          assert {p.name for p in stage.iterdir()}==allowed
          forbidden={'.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.zip','.tar','.pem','.key'}
          for file in stage.rglob('*'):
            if not file.is_file():continue
            assert file.suffix.lower() not in forbidden and not file.name.startswith('.env'),file
            if file.suffix in {'.html','.js','.css'}:
              data=file.read_bytes().replace(b'/SGUA_OFFICE/',b'/STRATEGYTRAVELSGUA/')
              file.write_bytes(data)
              assert b'/SGUA_OFFICE/' not in data,file
          assert '/STRATEGYTRAVELSGUA/assets/' in (stage/'index.html').read_text()
          for file in ['data/registry.json','data/geometry.json','data/photo-tour.json','assets/academy/studio/manifest.json','assets/academy/studio/room-202-studio.glb']:
            assert (stage/file).is_file(),file
          assert any(b'room202-batching-20261106' in f.read_bytes() for f in (stage/'assets').glob('*.js'))
          release={'sourceCommit':'56098d494ff9faa814c42382813da0a8da033f44','runtimeRevision':'room202-batching-20261106','resourceRevision':'room202-pbr-20261105','publicBase':'/STRATEGYTRAVELSGUA/','date':'2026-11-06','facilityStorage':'browser-local','sourceArtifactSha256':'f92f419d3c1adbe3c0d43b79f48a6400be5ac80518870eef43a7a1c92b2b6c61'}
          (stage/'release.json').write_text(json.dumps(release,indent=2)+'\n')
          for name in sorted(allowed|{'release.json'}):
            source=stage/name;dest=pathlib.Path(name)
            if dest.is_dir():shutil.rmtree(dest)
            elif dest.exists():dest.unlink()
            if source.is_dir():shutil.copytree(source,dest)
            else:shutil.copy2(source,dest)
          print('Verified current Room 202 release, semantic resources and GitHub Pages base.')
          PY
      - name: Retain the published application in the public repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll assets data plans index.html favicon.svg sgua-95.svg release.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish current digital twin from SGUA_OFFICE 56098d4"
            git push origin HEAD:main
          fi
      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload current public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
